openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: MobiTrack - Phone & Accessory Business Management API for Zambia
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Phone and accessory inventory
  - name: sales
    description: Sales transactions
  - name: customers
    description: Customer records
  - name: expenses
    description: Business expenses
  - name: anthropic
    description: Anthropic AI chat operations
  - name: suppliers
    description: Product suppliers
  - name: dashboard
    description: Dashboard analytics and summaries
  - name: money
    description: Business capital, cash flow, and withdrawals
  - name: business
    description: Real-business setup and data reset controls

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Products ──────────────────────────────────────────────
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: lowStock
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /business/settings:
    get:
      operationId: getBusinessSettings
      tags: [business]
      summary: Get real-business setup status
      responses:
        "200":
          description: Business setup settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessSettings"
    put:
      operationId: saveBusinessSettings
      tags: [business]
      summary: Save real-business setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessSettingsInput"
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessSettings"

  /business/reset:
    post:
      operationId: resetBusinessData
      tags: [business]
      summary: Reset business data after explicit confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetBusinessDataInput"
      responses:
        "200":
          description: Reset completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetResult"
        "400":
          description: Confirmation required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /products/low-stock:
    get:
      operationId: getLowStockProducts
      tags: [products]
      summary: Get products with low stock
      responses:
        "200":
          description: Low stock products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  # ── Customers ─────────────────────────────────────────────
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List all customers
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Delete a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  # ── Suppliers ─────────────────────────────────────────────
  /suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      summary: List all suppliers
      responses:
        "200":
          description: List of suppliers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supplier"
    post:
      operationId: createSupplier
      tags: [suppliers]
      summary: Create a supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"

  /suppliers/{id}:
    patch:
      operationId: updateSupplier
      tags: [suppliers]
      summary: Update a supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
    delete:
      operationId: deleteSupplier
      tags: [suppliers]
      summary: Delete a supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  # ── Sales ─────────────────────────────────────────────────
  /sales:
    get:
      operationId: listSales
      tags: [sales]
      summary: List all sales
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: customerId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of sales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
    post:
      operationId: createSale
      tags: [sales]
      summary: Record a new sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"

  /sales/{id}:
    get:
      operationId: getSale
      tags: [sales]
      summary: Get a sale
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
    delete:
      operationId: deleteSale
      tags: [sales]
      summary: Delete/void a sale
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  # ── Expenses ──────────────────────────────────────────────
  /expenses:
    get:
      operationId: listExpenses
      tags: [expenses]
      summary: List all expenses
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
    post:
      operationId: createExpense
      tags: [expenses]
      summary: Record an expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"

  /expenses/{id}:
    patch:
      operationId: updateExpense
      tags: [expenses]
      summary: Update an expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
    delete:
      operationId: deleteExpense
      tags: [expenses]
      summary: Delete an expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  # ── Dashboard ─────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get business overview summary
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [today, week, month, year, all]
            default: month
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent sales and expenses
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentActivity"

  /dashboard/sales-by-category:
    get:
      operationId: getSalesByCategory
      tags: [dashboard]
      summary: Revenue grouped by product category
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [week, month, year, all]
            default: month
      responses:
        "200":
          description: Sales by category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryRevenue"

  /dashboard/profit-loss:
    get:
      operationId: getProfitLoss
      tags: [dashboard]
      summary: Profit and loss report over time
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [week, month, year]
            default: month
      responses:
        "200":
          description: Profit/loss data points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProfitLossPoint"

  /dashboard/top-products:
    get:
      operationId: getTopProducts
      tags: [dashboard]
      summary: Best selling products by revenue
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 5
        - name: period
          in: query
          schema:
            type: string
            enum: [week, month, year, all]
            default: month
      responses:
        "200":
          description: Top products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopProduct"

  # ── Money ──────────────────────────────────────────────────
  /money/summary:
    get:
      operationId: getMoneySummary
      tags: [money]
      summary: Get business capital and cash flow summary
      responses:
        "200":
          description: Money summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoneySummary"

  /money/withdrawals:
    get:
      operationId: listWithdrawals
      tags: [money]
      summary: List personal withdrawals
      responses:
        "200":
          description: Withdrawals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Withdrawal"
    post:
      operationId: createWithdrawal
      tags: [money]
      summary: Record a personal withdrawal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalInput"
      responses:
        "201":
          description: Withdrawal recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalCreated"
        "400":
          description: Invalid withdrawal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /money/withdrawals/{id}:
    delete:
      operationId: deleteWithdrawal
      tags: [money]
      summary: Delete a personal withdrawal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Anthropic AI ──────────────────────────────────────────
  /anthropic/conversations:
    get:
      operationId: listAnthropicConversations
      tags: [anthropic]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicConversation"
    post:
      operationId: createAnthropicConversation
      tags: [anthropic]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversation"
  /anthropic/conversations/{id}:
    get:
      operationId: getAnthropicConversation
      tags: [anthropic]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
    delete:
      operationId: deleteAnthropicConversation
      tags: [anthropic]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
  /anthropic/conversations/{id}/messages:
    get:
      operationId: listAnthropicMessages
      tags: [anthropic]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicMessage"
    post:
      operationId: sendAnthropicMessage
      tags: [anthropic]
      summary: Send a message and receive an AI response (SSE stream)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicMessageInput"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    DeleteResult:
      type: object
      properties:
        success:
          type: boolean
        id:
          type: integer
      required:
        - success
        - id

    # ── Product ────────────────────────────────────────────
    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        sku:
          type: ["string", "null"]
        category:
          type: string
          description: "phones | accessories | tablets | other"
        brand:
          type: ["string", "null"]
        model:
          type: ["string", "null"]
        storage:
          type: ["string", "null"]
        color:
          type: ["string", "null"]
        condition:
          type: ["string", "null"]
        imei:
          type: ["string", "null"]
        batteryHealth:
          type: ["string", "null"]
        costPrice:
          type: number
          description: Purchase price in ZMW
        sellingPrice:
          type: number
          description: Expected selling price in ZMW; actual sale prices remain on sale items
        acquisitionType:
          type: string
          enum: [purchased, free_gift, trade_in, other]
        purchasePrice:
          type: number
        shippingCost:
          type: number
        customsCost:
          type: number
        repairCost:
          type: number
        accessoriesCost:
          type: number
        otherCost:
          type: number
        tradeValue:
          type: number
        acquisitionNote:
          type: ["string", "null"]
        acquisitionDate:
          type: ["string", "null"]
          format: date-time
        stockQuantity:
          type: integer
        lowStockThreshold:
          type: integer
        description:
          type: ["string", "null"]
        supplierId:
          type: ["integer", "null"]
        supplierName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - category
        - costPrice
        - sellingPrice
        - stockQuantity
        - lowStockThreshold
        - createdAt
        - updatedAt

    ProductInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        sku:
          type: string
        category:
          type: string
        brand:
          type: string
        model:
          type: string
        storage:
          type: string
        color:
          type: string
        condition:
          type: string
        imei:
          type: string
        batteryHealth:
          type: string
        costPrice:
          type: number
          minimum: 0
        sellingPrice:
          type: number
          minimum: 0
        acquisitionType:
          type: string
          enum: [purchased, free_gift, trade_in, other]
        purchasePrice:
          type: number
          minimum: 0
        shippingCost:
          type: number
          minimum: 0
        customsCost:
          type: number
          minimum: 0
        repairCost:
          type: number
          minimum: 0
        accessoriesCost:
          type: number
          minimum: 0
        otherCost:
          type: number
          minimum: 0
        tradeValue:
          type: number
          minimum: 0
        acquisitionNote:
          type: string
        acquisitionDate:
          type: string
          format: date-time
        stockQuantity:
          type: integer
          minimum: 0
        lowStockThreshold:
          type: integer
          minimum: 0
        description:
          type: string
        supplierId:
          type: integer
      required:
        - name
        - category
        - costPrice
        - sellingPrice

        - stockQuantity

    ProductUpdate:
      type: object
      properties:
        name:
          type: string
        sku:
          type: string
        category:
          type: string
        brand:
          type: string
        model:
          type: string
        storage:
          type: string
        color:
          type: string
        condition:
          type: string
        imei:
          type: string
        batteryHealth:
          type: string
        costPrice:
          type: number
          minimum: 0
        sellingPrice:
          type: number
          minimum: 0
        stockQuantity:
          type: integer
          minimum: 0
        lowStockThreshold:
          type: integer
          minimum: 0
        description:
          type: string
        supplierId:
          type: integer
        acquisitionType:
          type: string
          enum: [purchased, free_gift, trade_in, other]
        purchasePrice:
          type: number
          minimum: 0
        shippingCost:
          type: number
          minimum: 0
        customsCost:
          type: number
          minimum: 0
        repairCost:
          type: number
          minimum: 0
        accessoriesCost:
          type: number
          minimum: 0
        otherCost:
          type: number
          minimum: 0
        tradeValue:
          type: number
          minimum: 0
        acquisitionNote:
          type: string
        acquisitionDate:
          type: string
          format: date-time

    BusinessSettings:
      type: object
      properties:
        setupCompleted:
          type: boolean
        openingCash:
          type: number
        currentPhoneCount:
          type: integer
      required: [setupCompleted, openingCash, currentPhoneCount]

    BusinessSettingsInput:
      type: object
      properties:
        openingCash:
          type: number
          minimum: 0
        currentPhoneCount:
          type: integer
          minimum: 0
      required: [openingCash, currentPhoneCount]

    ResetResult:
      type: object
      properties:
        success:
          type: boolean
      required: [success]

    ResetBusinessDataInput:
      type: object
      properties:
        confirm:
          type: boolean
      required: [confirm]

    # ── Customer ───────────────────────────────────────────
    Customer:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        totalPurchases:
          type: integer
        totalSpent:
          type: number
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - totalPurchases
        - totalSpent
        - createdAt

    CustomerInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
        email:
          type: string
        address:
          type: string
      required:
        - name

    CustomerUpdate:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string

    # ── Supplier ───────────────────────────────────────────
    Supplier:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        contactName:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - createdAt

    SupplierInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        contactName:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        notes:
          type: string
      required:
        - name

    SupplierUpdate:
      type: object
      properties:
        name:
          type: string
        contactName:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        notes:
          type: string

    # ── Sale ──────────────────────────────────────────────
    Sale:
      type: object
      properties:
        id:
          type: integer
        customerId:
          type: ["integer", "null"]
        customerName:
          type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/SaleItem"
        subtotal:
          type: number
        discount:
          type: number
        totalAmount:
          type: number
        totalCost:
          type: number
        profit:
          type: number
        paymentMethod:
          type: string
          description: "cash | mobile_money | bank_transfer | card"
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - items
        - subtotal
        - discount
        - totalAmount
        - totalCost
        - profit
        - paymentMethod
        - createdAt

    SaleItem:
      type: object
      properties:
        id:
          type: integer
        productId:
          type: integer
        productName:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
        unitCost:
          type: number
        lineTotal:
          type: number
        lineProfit:
          type: number
      required:
        - id
        - productId
        - productName
        - quantity
        - unitPrice
        - unitCost
        - lineTotal
        - lineProfit

    SaleInput:
      type: object
      properties:
        customerId:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/SaleItemInput"
          minItems: 1
        discount:
          type: number
          minimum: 0
        paymentMethod:
          type: string
        notes:
          type: string
      required:
        - items
        - paymentMethod

    SaleItemInput:
      type: object
      properties:
        productId:
          type: integer
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: number
          minimum: 0
      required:
        - productId
        - quantity
        - unitPrice

    # ── Expense ───────────────────────────────────────────
    Expense:
      type: object
      properties:
        id:
          type: integer
        description:
          type: string
        category:
          type: string
          description: "rent | utilities | transport | marketing | salaries | stock | other"
        amount:
          type: number
        date:
          type: string
          format: date
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - description
        - category
        - amount
        - date
        - createdAt

    ExpenseInput:
      type: object
      properties:
        description:
          type: string
          minLength: 1
        category:
          type: string
        amount:
          type: number
          minimum: 0
        date:
          type: string
          format: date
        notes:
          type: string
      required:
        - description
        - category
        - amount
        - date

    ExpenseUpdate:
      type: object
      properties:
        description:
          type: string
        category:
          type: string
        amount:
          type: number
          minimum: 0
        date:
          type: string
          format: date
        notes:
          type: string

    # ── Dashboard ─────────────────────────────────────────
    DashboardSummary:
      type: object
      properties:
        totalRevenue:
          type: number
        totalCost:
          type: number
        totalProfit:
          type: number
        totalExpenses:
          type: number
        netProfit:
          type: number
        totalSales:
          type: integer
        totalProductsSold:
          type: integer
        inventoryValue:
          type: number
        totalProducts:
          type: integer
        lowStockCount:
          type: integer
        totalCustomers:
          type: integer
        period:
          type: string
      required:
        - totalRevenue
        - totalCost
        - totalProfit
        - totalExpenses
        - netProfit
        - totalSales
        - totalProductsSold
        - inventoryValue
        - totalProducts
        - lowStockCount
        - totalCustomers
        - period

    RecentActivity:
      type: object
      properties:
        sales:
          type: array
          items:
            $ref: "#/components/schemas/Sale"
        expenses:
          type: array
          items:
            $ref: "#/components/schemas/Expense"
      required:
        - sales
        - expenses

    CategoryRevenue:
      type: object
      properties:
        category:
          type: string
        revenue:
          type: number
        profit:
          type: number
        unitsSold:
          type: integer
      required:
        - category
        - revenue
        - profit
        - unitsSold

    ProfitLossPoint:
      type: object
      properties:
        label:
          type: string
        revenue:
          type: number
        expenses:
          type: number
        profit:
          type: number
      required:
        - label
        - revenue
        - expenses
        - profit

    TopProduct:
      type: object
      properties:
        productId:
          type: integer
        productName:
          type: string
        category:
          type: string
        unitsSold:
          type: integer
        revenue:
          type: number
        profit:
          type: number
      required:
        - productId
        - productName
        - category
        - unitsSold
        - revenue
        - profit

    # ── Money ───────────────────────────────────────────────
    MoneySummary:
      type: object
      properties:
        businessCapital:
          type: number
        requiredReplacementCapital:
          type: number
        stockCost:
          type: number
        stockValue:
          type: number
        potentialProfit:
          type: number
        cashAvailable:
          type: number
        totalRevenue:
          type: number
        totalCogs:
          type: number
        realizedGrossProfit:
          type: number
        operatingExpenses:
          type: number
        personalWithdrawals:
          type: number
        phonesInStock:
          type: integer
        phonesSold:
          type: integer
      required:
        - businessCapital
        - requiredReplacementCapital
        - stockCost
        - stockValue
        - potentialProfit
        - cashAvailable
        - totalRevenue
        - totalCogs
        - realizedGrossProfit
        - operatingExpenses
        - personalWithdrawals
        - phonesInStock
        - phonesSold

    Withdrawal:
      type: object
      properties:
        id:
          type: integer
        amount:
          type: number
        date:
          type: string
          format: date
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
        category:
          type: string
      required:
        - id
        - amount
        - date
        - reason
        - category
        - createdAt

    WithdrawalInput:
      type: object
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
        date:
          type: string
          format: date
        reason:
          type: string
          minLength: 1
        category:
          type: string
          enum: [new_phone_stock, shipping, repairs, accessories, advertising, transport, business_equipment, personal, other]
          default: personal
        confirm:
          type: boolean
          default: false
      required:
        - amount
        - date
        - reason

    WithdrawalCreated:
      type: object
      properties:
        withdrawal:
          $ref: "#/components/schemas/Withdrawal"
        warning:
          type: boolean
        cashAvailableAfter:
          type: number
        requiredReplacementCapital:
          type: number
      required:
        - withdrawal
        - warning
        - cashAvailableAfter
        - requiredReplacementCapital

    # ── Anthropic ─────────────────────────────────────────
    AnthropicConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt
    AnthropicMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt
    AnthropicConversationInput:
      type: object
      properties:
        title:
          type: string
      required:
        - title
    AnthropicMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content
    AnthropicConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AnthropicMessage"
      required:
        - id
        - title
        - createdAt
        - messages
    AnthropicError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
